<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Thulir Unavagam</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="brand">
    <img src="assets/logo.jpeg" alt="Thulir Unavagam Logo">

    <div>
      <h1>Thulir Unavagam</h1>
      <p>Fresh food, every day</p>
    </div>
  </div>

  <div class="nav-actions">
    <a href="index.html">🍽️ Menu</a>
    <a href="cart.html">🛒 Cart</a>
  </div>
</header>


<main>

  <section class="menu-section">

    <div class="section-heading">
      <p class="eyebrow">CHECKOUT</p>

      <h2>Complete Your Order</h2>

      <p>
        Choose Dine-in or Parcel and tell us your expected arrival time.
      </p>
    </div>


    <div class="checkout-box">

      <form id="checkoutForm">

        <!-- CUSTOMER NAME -->

        <label for="customerName">
          Customer Name
        </label>

        <input
          type="text"
          id="customerName"
          placeholder="Enter your name"
          required
        >


        <!-- PHONE -->

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="Enter 10-digit phone number"
          maxlength="10"
          inputmode="numeric"
          required
        >


        <!-- ORDER TYPE -->

        <label>
          Order Type
        </label>

        <div class="payment-option">

          <label class="payment-card">

            <input
              type="radio"
              name="order_type"
              value="Dine-in"
              checked
            >

            <span>🍽️ Dine-in</span>

          </label>


          <label class="payment-card">

            <input
              type="radio"
              name="order_type"
              value="Parcel"
            >

            <span>📦 Parcel</span>

          </label>

        </div>


        <!-- ARRIVAL TIME -->

        <label for="arrivalTime">
          Expected Arrival Time
        </label>

        <input
          type="time"
          id="arrivalTime"
          required
        >

        <p class="form-help">
          Please choose the time you expect to arrive at the shop.
        </p>


        <!-- PAYMENT -->

        <label>
          Payment Method
        </label>

        <div class="payment-option">

          <label class="payment-card">

            <input
              type="radio"
              name="payment_method"
              value="Cash on Delivery"
              checked
            >

            <span>💵 Cash on Delivery</span>

          </label>

        </div>


        <!-- SUMMARY -->

        <div id="checkoutSummary"></div>


        <!-- PLACE ORDER -->

        <button
          type="submit"
          class="checkout-btn"
        >
          🛒 Place Order
        </button>

      </form>


      <p id="checkoutMessage"></p>

    </div>

  </section>

</main>


<footer>

  <strong>Thulir Unavagam</strong>

  <p>Fresh food, every day.</p>

  <p>
    © 2026 Thulir Unavagam. All rights reserved.
  </p>

</footer>


<script src="checkout.js"></script>

</body>
</html>
