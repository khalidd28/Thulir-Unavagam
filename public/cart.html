<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cart | Thuliir Unavagam</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* ================================
       CART PAGE
    ================================= */

    .cart-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px 80px;
    }

    .cart-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .cart-header h2 {
      font-size: 38px;
      margin: 8px 0;
    }

    .cart-header p {
      color: #666;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 30px;
      align-items: start;
    }

    .cart-items-box,
    .cart-summary-box {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .cart-items-box h3,
    .cart-summary-box h3 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 85px 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-image {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 12px;
    }

    .cart-item-info h4 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .cart-item-price {
      color: #198754;
      font-weight: 700;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .quantity-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: #198754;
      color: white;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .quantity-btn:hover {
      opacity: 0.85;
    }

    .quantity-value {
      min-width: 30px;
      text-align: center;
      font-weight: 700;
    }

    .cart-item-total {
      font-weight: 700;
      font-size: 18px;
      text-align: right;
    }

    .remove-btn {
      display: block;
      margin-top: 8px;
      border: none;
      background: transparent;
      color: #dc3545;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
    }

    .remove-btn:hover {
      text-decoration: underline;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      color: #555;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 18px;
      border-top: 2px solid #eeeeee;
      font-size: 22px;
      font-weight: 800;
    }

    .summary-total strong {
      color: #198754;
    }

    .checkout-btn-cart {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #198754;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .checkout-btn-cart:hover {
      background: #146c43;
    }

    .continue-shopping {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #198754;
      text-decoration: none;
      font-weight: 600;
    }

    .empty-cart {
      text-align: center;
      padding: 70px 20px;
    }

    .empty-cart-icon {
      font-size: 70px;
      margin-bottom: 15px;
    }

    .empty-cart h3 {
      font-size: 28px;
      margin: 10px 0;
    }

    .empty-cart p {
      color: #666;
      margin-bottom: 25px;
    }

    .empty-cart-btn {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 10px;
      background: #198754;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 800px) {

      .cart-page {
        padding: 35px 15px 60px;
      }

      .cart-header h2 {
        font-size: 30px;
      }

      .cart-layout {
        grid-template-columns: 1fr;
      }

      .cart-summary-box {
        order: -1;
      }

    }

    @media (max-width: 550px) {

      .cart-items-box,
      .cart-summary-box {
        padding: 18px;
        border-radius: 14px;
      }

      .cart-item {
        grid-template-columns: 65px 1fr;
        gap: 12px;
      }

      .cart-item-image {
        width: 65px;
        height: 65px;
      }

      .cart-item-total {
        grid-column: 2;
        text-align: left;
      }

      .cart-item-info h4 {
        font-size: 16px;
      }

      .quantity-controls {
        margin-top: 7px;
      }

    }
  </style>
</head>

<body>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="brand">

      <img
        src="assets/logo.jpeg"
        alt="Thuliir Unavagam Logo"
      >

      <div>

        <h1>
          Thuliir Unavagam
        </h1>

        <p>
          Fresh food, every day
        </p>

      </div>

    </div>

    <div class="nav-actions">

      <a href="index.html">
        🍽️ Menu
      </a>

    </div>

  </header>


  <!-- CART -->

  <main>

    <section class="cart-page">

      <div class="cart-header">

        <p class="eyebrow">
          YOUR ORDER
        </p>

        <h2>
          🛒 Shopping Cart
        </h2>

        <p>
          Review your selected food before checkout.
        </p>

      </div>

      <div id="cartPageContainer"></div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer>

    <strong>
      Thuliir Unavagam
    </strong>

    <p>
      Fresh food, every day.
    </p>

    <p>
      © 2026 Thuliir Unavagam. All rights reserved.
    </p>

  </footer>


  <script src="cart.js"></script>

</body>

</html>
