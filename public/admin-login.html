<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin Login | Thuliir Unavagam
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <header class="navbar">

    <div class="brand">

      <img
        src="assets/logo.jpeg"
        alt="Thuliir Unavagam Logo"
      >

      <div>

        <h1>
          Thuliir Unavagam
        </h1>

        <p>
          Admin Panel
        </p>

      </div>

    </div>

  </header>


  <main>

    <section class="menu-section">

      <div class="checkout-box">

        <div class="section-heading">

          <p class="eyebrow">
            ADMIN PANEL
          </p>

          <h2>
            Admin Login
          </h2>

          <p>
            Login to manage orders and menu items.
          </p>

        </div>


        <form id="adminLoginForm">

          <label for="adminUsername">
            Username
          </label>

          <input
            type="text"
            id="adminUsername"
            placeholder="Enter username"
            required
          >


          <label for="adminPassword">
            Password
          </label>

          <input
            type="password"
            id="adminPassword"
            placeholder="Enter password"
            required
          >


          <button
            type="submit"
            class="checkout-btn"
          >
            🔐 Login
          </button>

        </form>


        <p id="loginMessage"></p>

      </div>

    </section>

  </main>


  <footer>

    <strong>
      Thuliir Unavagam
    </strong>

    <p>
      Fresh food, every day.
    </p>

    <p>
      © 2026 Thuliir Unavagam. All rights reserved.
    </p>

  </footer>


  <script src="admin-login.js"></script>

</body>

</html>
