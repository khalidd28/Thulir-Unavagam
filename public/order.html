<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Orders | Thulir Unavagam</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .orders-page {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    .phone-search {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      margin-bottom: 30px;
    }

    .phone-search label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .phone-search input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      box-sizing: border-box;
      font-size: 15px;
    }

    .orders-list {
      display: grid;
      gap: 20px;
    }

    .order-card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .order-header h3 {
      margin: 0 0 5px;
    }

    .order-header small {
      color: #777;
    }

    .status-badge {
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      background: #eaf4ff;
    }

    .order-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-box {
      background: #f7f9fb;
      padding: 14px;
      border-radius: 10px;
    }

    .info-box span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-box strong {
      display: block;
      font-size: 15px;
    }

    .order-items {
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
    }

    .order-total {
      border-top: 1px solid #eee;
      margin-top: 15px;
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
    }

    .track-btn {
      margin-top: 18px;
      display: inline-block;
      text-decoration: none;
    }

    .empty-orders {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    #ordersMessage {
      margin-top: 12px;
    }

    @media (max-width: 700px) {

      .order-info {
        grid-template-columns: 1fr;
      }

      .order-card {
        padding: 18px;
      }

      .order-item {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="brand">

      <img
        src="assets/logo.jpeg"
        alt="Thulir Unavagam Logo"
      >

      <div>
        <h1>Thulir Unavagam</h1>
        <p>Fresh food, every day</p>
      </div>

    </div>

    <div class="nav-actions">

      <a href="index.html">
        🍽️ Menu
      </a>

      <a href="cart.html">
        🛒 Cart
      </a>

    </div>

  </header>


  <!-- MAIN -->
  <main>

    <section class="orders-page">

      <div class="section-heading">

        <p class="eyebrow">
          MY ORDERS
        </p>

        <h2>
          Track Your Orders
        </h2>

        <p>
          Enter your phone number to view your orders.
        </p>

      </div>


      <!-- PHONE SEARCH -->
      <div class="phone-search">

        <label for="phoneInput">
          Phone Number
        </label>

        <input
          type="tel"
          id="phoneInput"
          maxlength="10"
          inputmode="numeric"
          placeholder="Enter 10-digit phone number"
        >

        <button
          class="checkout-btn"
          onclick="loadMyOrders()"
        >
          🔍 View My Orders
        </button>

        <p id="ordersMessage"></p>

      </div>


      <!-- ORDERS -->
      <div
        id="ordersList"
        class="orders-list"
      ></div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>

    <strong>
      Thulir Unavagam
    </strong>

    <p>
      Fresh food, every day.
    </p>

    <p>
      © 2026 Thulir Unavagam. All rights reserved.
    </p>

  </footer>


  <!-- JAVASCRIPT -->
  <script>

    // =====================================================
    // LOAD CUSTOMER ORDERS
    // =====================================================

    async function loadMyOrders() {

      const phoneInput =
        document.getElementById("phoneInput");

      const message =
        document.getElementById("ordersMessage");

      const ordersList =
        document.getElementById("ordersList");


      const phone =
        phoneInput.value.trim();


      // Validate phone number
      if (!/^\d{10}$/.test(phone)) {

        message.textContent =
          "Please enter a valid 10-digit phone number.";

        message.style.color = "red";

        return;
      }


      message.textContent =
        "Loading orders...";

      message.style.color = "";


      ordersList.innerHTML = "";


      try {

        const response =
          await fetch(
            `/api/my-orders/${encodeURIComponent(phone)}`
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Unable to load orders."
          );
        }


        // No orders
        if (
          !data.orders ||
          data.orders.length === 0
        ) {

          ordersList.innerHTML = `

            <div class="empty-orders">

              <h3>
                No Orders Found
              </h3>

              <p>
                No orders were found for this phone number.
              </p>

            </div>

          `;

          message.textContent = "";

          return;
        }


        message.textContent =
          `${data.total_orders} order(s) found.`;


        // Display orders
        data.orders.forEach(order => {

          ordersList.innerHTML +=
            createOrderCard(order);

        });


      } catch (error) {

        console.error(
          "MY ORDERS ERROR:",
          error
        );

        message.textContent =
          error.message ||
          "Unable to load orders.";

        message.style.color = "red";

      }

    }


    // =====================================================
    // CREATE ORDER CARD
    // =====================================================

    function createOrderCard(order) {

      let itemsHTML = "";


      if (
        order.items &&
        order.items.length > 0
      ) {

        order.items.forEach(item => {

          const price =
            Number(item.unit_price || 0);

          const quantity =
            Number(item.quantity || 0);

          const total =
            price * quantity;


          itemsHTML += `

            <div class="order-item">

              <span>
                ${escapeHtml(item.food_name)}
                × ${quantity}
              </span>

              <strong>
                ₹${total.toFixed(2)}
              </strong>

            </div>

          `;

        });

      } else {

        itemsHTML = `

          <p>
            No item details available.
          </p>

        `;

      }


      // Format date
      const date =
        order.created_at
          ? new Date(order.created_at)
              .toLocaleString()
          : "-";


      // Format arrival time
      let arrivalTime =
        order.arrival_time || "-";


      // Convert HH:MM:SS to HH:MM
      if (
        arrivalTime.length >= 5
      ) {

        arrivalTime =
          arrivalTime.substring(0, 5);

      }


      return `

        <div class="order-card">

          <div class="order-header">

            <div>

              <h3>
                Order #${order.order_id}
              </h3>

              <small>
                ${escapeHtml(date)}
              </small>

            </div>

            <div class="status-badge">

              ${escapeHtml(order.status)}

            </div>

          </div>


          <div class="order-info">

            <!-- CUSTOMER -->

            <div class="info-box">

              <span>
                Customer
              </span>

              <strong>
                ${escapeHtml(
                  order.customer_name
                )}
              </strong>

            </div>


            <!-- ORDER TYPE -->

            <div class="info-box">

              <span>
                Order Type
              </span>

              <strong>
                ${escapeHtml(
                  order.order_type || "-"
                )}
              </strong>

            </div>


            <!-- ARRIVAL TIME -->

            <div class="info-box">

              <span>
                Expected Arrival
              </span>

              <strong>
                ${escapeHtml(
                  arrivalTime
                )}
              </strong>

            </div>

          </div>


          <!-- ITEMS -->

          <div class="order-items">

            <strong>
              Items
            </strong>

            ${itemsHTML}

          </div>


          <!-- TOTAL -->

          <div class="order-total">

            <span>
              Total
            </span>

            <span>
              ₹${Number(
                order.total_amount || 0
              ).toFixed(2)}
            </span>

          </div>


          <!-- TRACK -->

          <a
            href="index.html?track=${encodeURIComponent(
              order.order_id
            )}"
            class="checkout-btn track-btn"
          >
            📍 Track Order
          </a>

        </div>

      `;

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // ENTER KEY SUPPORT
    // =====================================================

    document
      .getElementById("phoneInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            loadMyOrders();

          }

        }
      );

  </script>

</body>
</html>
