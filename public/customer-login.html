<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login - Thuliir Unavagam</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0d6efd;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #0b5ed7;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <img src="assets/logo.jpeg" alt="Thuliir Unavagam">
    </div>

    <h1>Customer Login</h1>

    <p class="subtitle">
        Login to view your orders
    </p>

    <form id="loginForm">

        <div class="form-group">
            <label for="login">Phone Number or Email</label>

            <input
                type="text"
                id="login"
                placeholder="Enter phone or email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="register-link">
        Don't have an account?
        <a href="customer-register.html">Create Account</a>
    </div>

    <a href="index.html" class="back-link">
        ← Back to Menu
    </a>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const login =
            document.getElementById("login").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        message.textContent = "Logging in...";
        message.style.color = "#555";

        try {

            const response = await fetch(
                "/api/customer/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        login: login,
                        password: password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {

                message.textContent =
                    data.message || "Login failed.";

                message.style.color = "red";

                return;
            }

            message.textContent =
                "Login successful!";

            message.style.color = "green";

            setTimeout(() => {

                window.location.href = "order.html";

            }, 700);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to server.";

            message.style.color = "red";
        }

    });

</script>

</body>
</html>
